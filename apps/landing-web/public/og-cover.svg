<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f1625" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g stroke="#1e2740" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <circle cx="120" cy="120" r="4" fill="#4ade80" />
  <circle cx="120" cy="120" r="14" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.4" />
  <circle cx="1080" cy="510" r="4" fill="#00f2fe" />
  <circle cx="1080" cy="510" r="14" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.4" />

  <text x="90" y="290" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#9aa5bd" letter-spacing="4">
