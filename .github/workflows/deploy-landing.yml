name: Deploy GeoFleet Landing

on:
  push:
    branches:
      - main
    paths:
      - "landing-web/**"
      - ".github/workflows/deploy-landing.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-web/package-lock.json

      - name: Install dependencies
        working-directory: landing-web
        run: npm ci

      - name: Build Nuxt
        working-directory: landing-web
        env:
          NUXT_APP_BASE_URL: /geofleet-platform/
        run: npx nuxt build --preset github_pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: landing-web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5