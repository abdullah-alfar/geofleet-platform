# Local development Redis configuration.
#
# The password is intentionally NOT set here — it is passed via the
# `--requirepass` command-line flag in docker-compose.yml, sourced from
# .env, so no credential is ever committed to this file.

bind 0.0.0.0
protected-mode yes

# Durability: AOF is enough for local dev (fast restarts, no need for RDB
# snapshot tuning). Redis here holds live/derived state (locations, presence,
# offers), not the system of record, so durability requirements are low.
appendonly yes
appendfsync everysec

# Bound memory growth locally; evict least-recently-used keys first once full.
# Real capacity sizing happens in docs/architecture/scalability.md, not here.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Each writer (location-service, dispatch-service) sets its own per-key TTL
# (latest location, geo-cell membership, ride offers, WS presence) — no
# global expiry policy is defined at this layer.
